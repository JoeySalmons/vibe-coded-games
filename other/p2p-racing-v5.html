<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slipstream — P2P Racing</title>

<!-- ============================================================================
     SLIPSTREAM — host-authoritative P2P racing (WebRTC + ntfy signaling)
     ----------------------------------------------------------------------------
     Single file. No build, no backend, no accounts. ntfy.sh is used ONLY for the
     WebRTC handshake; all gameplay flows over DTLS-encrypted DataChannels.

     SECTION MAP (search these banners to jump around):
       [CONFIG]      tunables: ntfy, physics, netcode rates
       [TRACKS]      map data — append an object here to add a circuit
       [VEHICLES]    car stat presets (data-driven)
       [CRYPTO]      passphrase -> topic + AES key + derived hostId, signaling encryption
       [SIGNALING]   ntfy I/O and the encrypted room-message layer
       [NET]         peer-connection management (host = star hub)
       [HANDSHAKE]   joiner-initiated offer / host answer (2 ntfy msgs per client, no announce)
       [PROTOCOL]    DataChannel message dispatch
       [STATE]       shared game + lobby state
       [PHYSICS]     integration, car-car + car-wall collision (HOST ONLY)
       [LOOP]        host sim loop / client predict+interpolate loop
       [INPUT]       keyboard -> input frame
       [RENDER]      all canvas drawing lives here (safe to overhaul)
       [UI]          screens, lobby, HUD wiring
       [INIT]        boot
   ============================================================================ -->

<style>
  /* ---- design tokens : "pit-wall telemetry" --------------------------------
     dark asphalt + signal-amber, with electric cyan as the cool counter-accent.
     Mono is the *data* face (it is telemetry, so it's earned, not decoration);
     a condensed heavy face carries the title. Tune freely.                    */
  :root{
    --asphalt:#15181d;     --asphalt-2:#1d2128;   --line:#2c323c;
    --ink:#e9edf2;         --ink-dim:#8b95a3;
    --amber:#ff7a1a;       --amber-soft:#ffb066;
    --cyan:#27e0d8;        --good:#5ad17a;         --bad:#ff5d5d;
    --p1:#ff7a1a; --p2:#27e0d8; --p3:#ffd23f; --p4:#ff5db0; --p5:#7c5cff; --p6:#5ad17a;
    --rad:10px;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --disp:"Bahnschrift","DIN Condensed","Arial Narrow",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(120% 80% at 50% -10%,#222732 0%,var(--asphalt) 60%);
    color:var(--ink);font-family:var(--mono);font-size:14px;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px}
  .screen.active{display:flex}
  .card{
    width:min(560px,100%);background:var(--asphalt-2);border:1px solid var(--line);
    border-radius:var(--rad);padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .brand{font-family:var(--disp);font-weight:700;letter-spacing:.04em;
    font-size:40px;line-height:.9;text-transform:uppercase;margin:0 0 2px}
  .brand b{color:var(--amber)}
  .tag{color:var(--ink-dim);font-size:12px;margin:0 0 22px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--ink-dim);margin:14px 0 6px}
  input[type=text]{width:100%;background:var(--asphalt);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:11px 12px;font-family:var(--mono);font-size:14px}
  input:focus{outline:2px solid var(--amber);outline-offset:1px}
  .row{display:flex;gap:10px;margin-top:16px}
  button{flex:1;cursor:pointer;border:1px solid var(--line);background:var(--asphalt);
    color:var(--ink);border-radius:8px;padding:12px 14px;font-family:var(--mono);
    font-size:13px;letter-spacing:.04em;transition:transform .05s,border-color .15s,background .15s}
  button:hover{border-color:var(--amber)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--amber);border-color:var(--amber);color:#1a1206;font-weight:700}
  button.ghost{flex:0 0 auto}
  .hint{color:var(--ink-dim);font-size:11px;margin-top:14px;line-height:1.5}

  /* lobby */
  .plist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .plist li{display:flex;align-items:center;gap:10px;background:var(--asphalt);
    border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .pname{flex:1}
  .pstat{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.1em}
  .pstat.ready{color:var(--good)}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .seg button{flex:0 0 auto;padding:8px 12px;font-size:12px}
  .seg button.sel{border-color:var(--amber);color:var(--amber)}
  .swatches button.swatch{width:34px;height:26px;padding:0;border-radius:7px;
    border:2px solid var(--line);position:relative}
  .swatches button.swatch.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--asphalt-2),0 0 0 4px var(--ink)}
  .swatches button.swatch:disabled{opacity:1;cursor:not-allowed;filter:saturate(.5) brightness(.6)}
  .swatches button.swatch:disabled::after{content:"";position:absolute;inset:0;border-radius:5px;
    background:linear-gradient(135deg,transparent 44%,var(--asphalt-2) 46%,var(--asphalt-2) 54%,transparent 56%)}
  .botchips button.botchip{display:flex;align-items:center;gap:7px;padding:7px 11px;font-size:12px}
  .botchips button.botchip .dot{width:10px;height:10px}
  .botchips button.botchip.sel{border-color:var(--ink);color:var(--ink)}
  .botchips button.botchip:not(.sel){opacity:.55}

  /* race */
  #sc-race{padding:0;display:none;flex-direction:column;align-items:stretch;justify-content:flex-start}
  #sc-race.active{display:flex}
  #stage{flex:1;position:relative;min-height:0;width:100%}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;pointer-events:none;font-family:var(--mono)}
  #hud-tl{top:12px;left:14px;font-size:12px;line-height:1.7}
  #hud-tl b{font-family:var(--disp);font-size:30px;color:var(--amber);letter-spacing:.02em}
  #hud-tr{top:12px;right:14px;text-align:right;font-size:12px;line-height:1.7;color:var(--ink-dim)}
  #hud-board{position:absolute;top:54px;right:14px;text-align:right;font-size:12px;line-height:1.8}
  #hud-board .me{color:var(--amber)}
  #countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-size:120px;color:var(--amber);text-shadow:0 6px 30px rgba(0,0,0,.6)}
  #banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--disp);
    font-size:56px;color:var(--cyan);text-shadow:0 4px 24px rgba(0,0,0,.6)}
  .pill{display:inline-block;background:rgba(0,0,0,.35);border:1px solid var(--line);
    border-radius:999px;padding:2px 10px}
  /* connection / log */
  #log{position:fixed;left:12px;bottom:12px;max-width:46ch;font-size:11px;color:var(--ink-dim);
    background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    max-height:30vh;overflow:auto;white-space:pre-wrap;display:none}
  #log.show{display:block}
  .net{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
  .net.ok{background:var(--good)} .net.warn{background:var(--p3)}
  /* passphrase share box (host lobby) */
  .passbox{display:flex;gap:8px;align-items:center;background:var(--asphalt);
    border:1px dashed var(--amber);border-radius:8px;padding:10px 12px;margin-top:6px}
  .passbox code{flex:1;color:var(--amber-soft);font-size:15px;word-break:break-all}
  .passbox button{flex:0 0 auto;padding:7px 12px;font-size:12px}
  /* in-race control bar */
  #racebar{left:14px;bottom:14px;display:flex;gap:10px;align-items:center;pointer-events:auto}
  #racebar button{padding:8px 14px;font-size:12px}
  #racebar .rp{color:var(--ink-dim);font-size:11px}
  #racebar .rp b{color:var(--amber-soft)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<!-- =================== [UI] SCREENS ==================================== -->

<!-- SETUP -->
<div id="sc-setup" class="screen active">
  <div class="card">
    <h1 class="brand">Slip<b>stream</b></h1>
    <p class="tag">peer-to-peer racing · no server · share a room name to play</p>
    <label for="inp-name">Driver name</label>
    <input id="inp-name" type="text" maxlength="14" placeholder="e.g. Maya" autocomplete="off">

      <button id="btn-solo">Solo / offline race &nbsp;·&nbsp; just you + bots</button>
    </div>
    <p class="hint">The passphrase is the only key — it derives a private signaling
      channel and encrypts the handshake. Same phrase, same day, on each device.
      Up to 6 humans + 8 bots. <a href="#" id="toggle-log" style="color:var(--cyan)">show log</a></p>
  </div>
</div>

<!-- LOBBY -->
<div id="sc-lobby" class="screen">
  <div class="card">
    <h1 class="brand" style="font-size:30px">Lobby <span id="lobby-room" style="color:var(--ink-dim);font-size:13px;font-family:var(--mono)"></span></h1>
    <p class="tag" id="lobby-role"></p>
    <div id="lobby-pass" style="display:none"></div>
    <div id="track-pick" style="display:none">
      <label>Circuit</label>
      <div class="seg" id="track-seg"></div>
    </div>
    <label>Drivers</label>
    <ul class="plist" id="lobby-list"></ul>
    <div id="color-pick" style="display:none">

    </div>

    </div>
    <div class="row">
      <button id="btn-ready">Ready up</button>
      <button id="btn-start" class="primary" style="display:none" disabled>Start race</button>
      <button id="btn-leave" class="ghost">Leave</button>
    </div>
    <p class="hint" id="lobby-hint"></p>
  </div>
</div>

<!-- RACE -->
<div id="sc-race" class="screen">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud-tl" class="hud"><div>LAP <b><span id="hud-lap">1</span></b><span style="color:var(--ink-dim)">/<span id="hud-laps">3</span></span></div><div>POS <span id="hud-pos">—</span></div></div>
    <div id="hud-tr" class="hud"><div><span class="net" id="net-dot"></span><span id="hud-ping">—</span> ms</div><div id="hud-time">0.0s</div></div>
    <div id="hud-board" class="hud"></div>
    <div id="countdown" class="hud" style="display:none"></div>
    <div id="banner" class="hud" style="display:none"></div>
    <div id="racebar" class="hud"><button id="btn-quit">Leave race</button><span class="rp" id="race-pass"></span></div>
  </div>
</div>

<div id="log"></div>

<script>
/* ===========================================================================
   [CONFIG]
   =========================================================================== */
const CFG = {
  NTFY:        'https://ntfy.sh/',
  STUN:        { iceServers:[{ urls:'stun:stun.l.google.com:19302' }] },
  // To support symmetric-NAT players, add a TURN entry here later.
  MAX_PLAYERS: 6,
  MAX_BOTS:    8,                      // roster size
  GRID_SLOTS:  16,                     // starting-grid positions (>= MAX_PLAYERS+MAX_BOTS)
  BOT_GRACE:   8,                      // s bots may keep racing after the last human finishes
  ROOM_PREFIX: 'slipstream',          // ntfy topic namespace
  SIG_TTL:     60*60,                  // ignore signaling msgs older than this (s)
  POLL_MS:     1500,                   // ntfy poll cadence during handshake
  ICE_WAIT:    4500,                   // ms to wait for ICE gathering before sending SDP
  // ---- netcode rates ----
  PHYS_HZ:     60,                     // host simulation tick
  NET_HZ:      20,                     // host -> client snapshot rate
  INPUT_HZ:    30,                     // client -> host input rate
  PING_MS:     2000,                   // heartbeat interval
  INTERP_MS:   100,                    // client renders remote cars this far in the past
  DROP_MS:     6000,                   // declare a peer gone after this much silence
  COUNTDOWN:   3,                      // seconds of "3-2-1-GO" before the green flag
};
const PHYS_DT = 1/CFG.PHYS_HZ;

/* ===========================================================================
   [TRACKS]  — pure data. Append an object to add a circuit.
   ---------------------------------------------------------------------------
   world units are arbitrary; the renderer fits the whole world to the canvas.
     outer / inner : closed polylines (point arrays) -> become wall segments
     checkpoints   : ordered gates {x,y,r}; car must pass them in order;
                     index 0 doubles as the start/finish line
     spawns        : up to MAX_PLAYERS grid slots {x,y,angle(rad)}
     boostPads     : {x,y,r} circles that add forward speed
     laps          : laps to finish
   =========================================================================== */
// ---- track authoring helpers ----
function ring(cx,cy,rx,ry,n){ const p=[]; for(let i=0;i<n;i++){const a=i/n*Math.PI*2;
  p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]);} return p; }
function wallsOf(track){ // polylines -> flat list of segments {ax,ay,bx,by}
  const segs=[]; for(const loop of [track.outer,track.inner]){
    for(let i=0;i<loop.length;i++){ const a=loop[i], b=loop[(i+1)%loop.length];
      segs.push({ax:a[0],ay:a[1],bx:b[0],by:b[1]}); } } return segs; }

// Oval factory: concentric outer/inner rings guarantee a well-defined lane
// centerline, so checkpoints sit *where the car drives* and the start/finish
// line spans the lane radially. Travel is clockwise (top -> right -> bottom -> left).
//   oRX,oRY = outer radii   iRX,iRY = inner radii (hole)
//   padOff  = boost-pad position across the lane (0 = centerline, 1 = outer wall)
function ovalTrack(o){
  const cx=o.cx??800, cy=o.cy??500;
  const cRX=(o.oRX+o.iRX)/2, cRY=(o.oRY+o.iRY)/2;     // lane centerline radii
  const cpR=o.cpR??160;
  const checkpoints=[                                  // [0] = start/finish (top)
    {x:cx,      y:cy-cRY, r:cpR},
    {x:cx+cRX,  y:cy,     r:cpR},
    {x:cx,      y:cy+cRY, r:cpR},
    {x:cx-cRX,  y:cy,     r:cpR},
  ];
  const startLine={ x1:cx, y1:cy-o.oRY, x2:cx, y2:cy-o.iRY }; // across the lane at the top
  // Starting grid: two columns trailing BACKWARD from the finish line along the lane
  // centerline (so it follows the oval's curve and stays on tarmac even for ~14 cars).
  // Forward travel is clockwise = increasing param angle; "behind" the line is smaller angle.
  const spawns=[]; const startA=-Math.PI/2, angStep=0.135;
  for(let i=0;i<CFG.GRID_SLOTS;i++){
    const col=Math.floor(i/2), sideOff=(i%2===0?-1:1)*34;     // two abreast across the lane
    const a=startA-(col+1)*angStep;                            // +1 keeps slot 0 behind the line
    const bx=cx+cRX*Math.cos(a), by=cy+cRY*Math.sin(a);
    const rx=Math.cos(a), ry=Math.sin(a);                      // ~radial (across-lane) offset
    const angle=Math.atan2(cRY*Math.cos(a), -cRX*Math.sin(a)); // tangent in the travel direction
    spawns.push({ x:bx+rx*sideOff, y:by+ry*sideOff, angle });
  }
  // boost pads on the top & bottom straights, pushed toward the outer wall.
  const padR=o.padR??70, off=o.padOff??0.62;
  const padTopY=cy-(cRY+(o.oRY-cRY)*off), padBotY=cy+(cRY+(o.oRY-cRY)*off);
  const boostPads=[ {x:cx, y:padTopY, r:padR}, {x:cx, y:padBotY, r:padR} ];
  return { name:o.name, laps:o.laps??3, world:{w:1600,h:1000},
    bg:o.bg??'#191d24', tar:o.tar??'#23272f',
    outer:ring(cx,cy,o.oRX,o.oRY,56), inner:ring(cx,cy,o.iRX,o.iRY,56),
    // travel is clockwise, so at the top finish line the car moves in +x:
    checkpoints, startLine, finishDir:{x:1,y:0}, spawns, boostPads };
}

const TRACKS = [
  ovalTrack({ name:'Sunset Oval', laps:3, oRX:720, oRY:440, iRX:360, iRY:200,
              bg:'#191d24', tar:'#23272f', padR:74, padOff:0.62 }),
  // Speedway: a thinner, faster lane — distinct feel from the Oval.
  ovalTrack({ name:'Speedway',    laps:3, oRX:745, oRY:460, iRX:470, iRY:250,
              bg:'#181b22', tar:'#222630', cpR:150, padR:78, padOff:0.66 }),
];

/* ===========================================================================
   [VEHICLES]  — data-driven stat presets. Add a kind, reference it at spawn.
   Longitudinal model is linear-drag: terminal speed = max, and the car rises to
   ~90% of max in ~2*driveTau seconds (driveTau≈0.85 -> ~2s). `max` here is the
   already-uplifted top speed (~25% above the old 430/400/440 values).
   =========================================================================== */
const VEHICLES = {
  // max | driveTau(accel feel) | turn | sideGrip | driftGrip | brakeA | mass | radius
  balanced:{ max:540, driveTau:0.85, turn:3.1, sideGrip:0.86, driftGrip:0.965, brakeA:1400, mass:1.0, radius:20 },
  heavy:   { max:500, driveTau:1.05, turn:2.5, sideGrip:0.88, driftGrip:0.970, brakeA:1100, mass:1.6, radius:23 },
  nimble:  { max:555, driveTau:0.75, turn:3.8, sideGrip:0.85, driftGrip:0.960, brakeA:1500, mass:0.8, radius:18 },
};
// 8 distinct, high-chroma hues. Deliberately kept far from the dark navy track
// background (#181-19x range) so no car ever blends into the asphalt.
const CAR_COLORS = ['#ff7a1a','#27e0d8','#ffd23f','#ff5db0','#7c5cff','#5ad17a','#ff5d5d','#4d9bff'];
// Bots get their OWN palette — muted/secondary tones, deliberately offset in hue
// and chroma from the vivid player colors above (and far from the dark asphalt) so
// a bot is never mistaken for a human car.
const BOT_DEFS = [
  { id:'b0', name:'Rusty',  color:'#d9603f', kind:'heavy'    },
  { id:'b1', name:'Goldie', color:'#cf9a2b', kind:'balanced' },
  { id:'b2', name:'Pickle', color:'#8fb83c', kind:'nimble'   },
  { id:'b3', name:'Jade',   color:'#2bb38a', kind:'balanced' },
  { id:'b4', name:'Sky',    color:'#2ba3c4', kind:'nimble'   },
  { id:'b5', name:'Cobalt', color:'#5566cc', kind:'heavy'    },
  { id:'b6', name:'Orchid', color:'#a85cc4', kind:'balanced' },
  { id:'b7', name:'Rosa',   color:'#d6517a', kind:'nimble'   },
];
const BOT_BY_ID = Object.fromEntries(BOT_DEFS.map(b=>[b.id,b]));
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ===========================================================================
   [CRYPTO]  — passphrase -> {topic, key}; AES-GCM for signaling payloads.
   (Lifted from the reference notes: PBKDF2 gate -> HKDF split, daily rotation.)
   =========================================================================== */
const enc = new TextEncoder(), dec = new TextDecoder();
async function deriveAll(pass){
  const date = new Date().toISOString().slice(0,10);            // YYYY-MM-DD
  const salt = enc.encode(`${CFG.ROOM_PREFIX}:master:${date}`);
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const masterBits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' }, base, 256);
  const master = await crypto.subtle.importKey('raw', masterBits, 'HKDF', false, ['deriveBits','deriveKey']);
  const topicBits = await crypto.subtle.deriveBits(
    { name:'HKDF', hash:'SHA-256', salt:new Uint8Array(0), info:enc.encode('rendezvous-topic') }, master, 96);
  const topic = CFG.ROOM_PREFIX + '-' + [...new Uint8Array(topicBits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  const key = await crypto.subtle.deriveKey(
    { name:'HKDF', hash:'SHA-256', salt:new Uint8Array(0), info:enc.encode('aes-gcm-256') },
    master, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  // Derive a stable host ID from the passphrase — every peer computes the same value,
  // so joiners know where to send their offer without any announce message from the host.
  const hostIdBits = await crypto.subtle.deriveBits(
    { name:'HKDF', hash:'SHA-256', salt:new Uint8Array(0), info:enc.encode('host-id') }, master, 40);
  const hostId = [...new Uint8Array(hostIdBits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return { topic, key, hostId };
}
async function aesEnc(key,obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, enc.encode(JSON.stringify(obj)));
  const out = new Uint8Array(12+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),12);
  return btoa(String.fromCharCode(...out));
}
async function aesDec(key,b64){
  try{
    const raw = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    const iv = raw.slice(0,12), ct = raw.slice(12);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
    return JSON.parse(dec.decode(pt));
  }catch{ return null; }   // wrong key / tampered -> dropped
}

/* ===========================================================================
   [SIGNALING]  — ntfy I/O + encrypted room-message helpers.
   One room topic; every message addressed with {from,to}. to:'*' = broadcast.
   =========================================================================== */
const SIG = { topic:null, key:null, hostId:null, since:0, seen:new Set(), poller:null };
async function ntfyPost(topic, body){
  await fetch(CFG.NTFY+topic, { method:'POST', body, headers:{'Content-Type':'text/plain'} });
}
async function ntfyPoll(topic, sinceSec){
  const r = await fetch(`${CFG.NTFY}${topic}/json?poll=1&since=${sinceSec}s`);
  const txt = await r.text();
  return txt.trim().split('\n').filter(Boolean).map(l=>{ try{return JSON.parse(l);}catch{return null;} }).filter(Boolean);
}
async function sigSend(msg){                      // msg: {k, from, to, ...}
  await ntfyPost(SIG.topic, await aesEnc(SIG.key, msg));
}
async function sigRecv(){                          // -> array of decrypted msgs (deduped, TTL-filtered)
  const now = Math.floor(Date.now()/1000);
  // Look back 120s so joiners who opened before the host (or vice versa) still find each other's messages.
  const raw = await ntfyPoll(SIG.topic, Math.min(3600, now - SIG.since + 120));
  const out = [];
  for(const m of raw){
    if(m.event!=='message' || SIG.seen.has(m.id)) continue;
    SIG.seen.add(m.id);
    if(now - m.time > CFG.SIG_TTL) continue;
    const dm = await aesDec(SIG.key, m.message);
    if(dm && !NET.myIds.has(dm.from)){ dm._age = now - m.time; out.push(dm); }
  }
  return out;
}

/* ===========================================================================
   [NET]  — peer-connection management. Host is the star hub.
   peers: Map(peerId -> { pc, ch, name, lastSeen, ping })
   =========================================================================== */
const NET = {
  role:null,            // 'host' | 'client'
  myId: randId(),
  myIds:new Set(),      // every id THIS TAB has ever used (survives fullReset) — never process your own messages
  hostId:null,          // client: derived host id (known before any ntfy message is exchanged)
  peers:new Map(),      // host: every client. client: just {hostId}
  hostCh:null,          // client: the single channel to host
  cancelled:false,
  offline:false,        // solo mode (no ntfy/signaling)
};
NET.myIds.add(NET.myId);
function randId(){ const b=crypto.getRandomValues(new Uint8Array(5));
  return [...b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function newPC(){ return new RTCPeerConnection(CFG.STUN); }
function waitIce(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const t=setTimeout(res, CFG.ICE_WAIT);
    pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==='complete'){clearTimeout(t);res();} };
  });
}
function wireChannel(ch, peerId){
  ch.binaryType='arraybuffer';
  ch.onopen   = ()=> onChannelOpen(ch, peerId);
  ch.onclose  = ()=> onChannelClose(peerId);
  ch.onmessage= e =>{ let d; try{ d=JSON.parse(e.data); }catch{ return; }
                      if(!d||typeof d!=='object') return; onNetMessage(d, peerId); };
}

/* ===========================================================================
   [HANDSHAKE]  — joiner-initiated offer / host answer over the room topic.
   Joiners know the host's ID from deriveAll() — no announce step needed.
   Flow per client: joiner posts {k:'offer'} → host posts {k:'answer'} → done.
   ntfy messages: exactly 2 × (N-1) for N players.
   =========================================================================== */
async function startSignaling(pass){
  const { topic, key, hostId } = await deriveAll(pass);
  SIG.topic=topic; SIG.key=key; SIG.hostId=hostId; SIG.since=Math.floor(Date.now()/1000);
  SIG.seen.clear();
  log('room topic '+topic.slice(-10));
  SIG.poller = setInterval(pumpSignaling, CFG.POLL_MS);
}
async function pumpSignaling(){
  let msgs; try{ msgs=await sigRecv(); }catch{ return; }
  for(const m of msgs){
    if(NET.role==='host'){
      // Joiner-initiated: client sends the offer, host answers
      if(m.k==='offer' && m.to===NET.myId) hostHandleOffer(m.from, m.sdp);
    }else if(NET.role==='client'){
      if(m.k==='answer' && m.to===NET.myId) clientHandleAnswer(m.from, m.sdp);
    }
  }
}
// ---- host ----
function hostBegin(){
  // Use the passphrase-derived ID so every joiner already knows it — no announce needed.
  NET.myId=SIG.hostId; NET.myIds.add(NET.myId);
  NET.role='host';
  GAME.hostId=NET.myId;
  // host is also a player:
  LOBBY.players.set(NET.myId,{ id:NET.myId, name:ME.name, ready:true, color:CAR_COLORS[0], slot:0 });
  log('hosting — waiting for drivers');
  broadcastLobby();
}
// Solo / offline: identical authoritative host sim, but no ntfy, no signaling, no
// announce — just the local player (+ bots). The race loop already runs fine with
// zero peers; hostBroadcast simply no-ops.
function soloBegin(){
  NET.role='host'; NET.offline=true;
  GAME.hostId=NET.myId;
  LOBBY.players.set(NET.myId,{ id:NET.myId, name:ME.name, ready:true, color:CAR_COLORS[0], slot:0 });
  log('solo mode — no network');
  broadcastLobby();
}
async function hostHandleOffer(clientId, sdp){
  if(NET.peers.has(clientId)) return;                 // already connecting/connected
  if(LOBBY.players.size>=CFG.MAX_PLAYERS){ log('room full, ignoring '+clientId.slice(0,4)); return; }
  log('offer from '+clientId.slice(0,4)+' — sending answer');
  const pc=newPC();
  // Host does NOT create the DataChannel — the joiner created it with the offer; host receives it via ondatachannel.
  pc.ondatachannel=e=>{ NET.peers.set(clientId,{pc, ch:e.channel, lastSeen:Date.now(), ping:0});
    wireChannel(e.channel, clientId); };
  pc.oniceconnectionstatechange=()=>{ if(['failed','disconnected','closed'].includes(pc.iceConnectionState)) onChannelClose(clientId); };
  await pc.setRemoteDescription({type:'offer', sdp});
  const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); await waitIce(pc);
  await sigSend({k:'answer', from:NET.myId, to:clientId, sdp:pc.localDescription.sdp});
}
// ---- client ----
function clientBegin(){
  NET.role='client';
  NET.hostId=SIG.hostId; GAME.hostId=SIG.hostId;     // host ID is known immediately from passphrase
  log('joining — sending offer to host');
  clientSendOffer();
}
async function clientSendOffer(){
  if(NET.hostCh) return;
  const pc=newPC();
  const ch=pc.createDataChannel('race',{ordered:true});  // joiner creates the DataChannel in the offer
  wireChannel(ch, NET.hostId);
  NET.peers.set(NET.hostId,{pc, ch, lastSeen:Date.now(), ping:0});
  pc.oniceconnectionstatechange=()=>{ if(['failed','disconnected','closed'].includes(pc.iceConnectionState)) onChannelClose(NET.hostId); };
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer); await waitIce(pc);
  await sigSend({k:'offer', from:NET.myId, to:NET.hostId, sdp:pc.localDescription.sdp});
  log('offer sent — waiting for answer');
}
async function clientHandleAnswer(hostId, sdp){
  if(NET.hostCh) return;                               // already connected
  const p=NET.peers.get(hostId); if(!p||p.pc.currentRemoteDescription) return;
  await p.pc.setRemoteDescription({type:'answer', sdp});
  log('answer received — establishing channel');
}

/* ===========================================================================
   [PROTOCOL]  — DataChannel messages.
   host->client : 'lobby','start','snap','done'
   client->host : 'hello','ready','input'
   both         : 'ping','pong'
   =========================================================================== */
function send(ch,obj){ if(ch && ch.readyState==='open') ch.send(JSON.stringify(obj)); }
function hostBroadcast(obj){ for(const p of NET.peers.values()) send(p.ch,obj); }

function onChannelOpen(ch, peerId){
  log('channel open '+peerId.slice(0,4));
  setNetDot('ok');
  // ntfy signaling is finished the moment any DataChannel opens — stop polling.
  // (Host waits a brief grace window in case more joiners are mid-handshake.)
  if(NET.role==='client'){
    if(SIG.poller){ clearInterval(SIG.poller); SIG.poller=null; }
    NET.hostCh=ch;
    send(ch,{t:'hello', name:ME.name});
    showScreen('lobby');
  }else{ // host: a client connected; send current lobby snapshot
    // Keep polling briefly so other joiners' offers (already in flight) are still processed.
    // Clear after a generous window once all expected peers are likely connected.
    if(!SIG._hostCloseTimer) SIG._hostCloseTimer=setTimeout(()=>{
      if(SIG.poller){ clearInterval(SIG.poller); SIG.poller=null; }
      SIG._hostCloseTimer=null;
    }, CFG.ICE_WAIT * 2);
    broadcastLobby();
  }
  startHeartbeat(ch, peerId);
}
function onChannelClose(peerId){
  if(NET.role==='host'){
    const nm=nameOf(peerId);
    if(NET.peers.has(peerId)){ NET.peers.get(peerId).pc.close(); NET.peers.delete(peerId); }
    LOBBY.players.delete(peerId); GAME.cars.delete(peerId);
    log('driver left '+peerId.slice(0,4)); if(typeof flash==='function') flash(`${nm} disconnected`);
    broadcastLobby();
  }else{
    log('lost host — returning to setup'); setNetDot('bad');
    fullReset(); showScreen('setup');
  }
}
function onNetMessage(d, peerId){
  const p=NET.peers.get(peerId); if(p) p.lastSeen=Date.now();
  switch(d.t){
    case 'ping': send(p?p.ch:NET.hostCh,{t:'pong',ts:d.ts}); break;
    case 'pong': if(p) p.ping=Date.now()-d.ts; break;
    case 'bye':
      if(NET.role==='host'){ onChannelClose(peerId); }
      else if(d.host){ flash('Host ended the session'); setTimeout(()=>{ fullReset(); showScreen('setup'); $('lobby-pass').style.display='none'; }, 900); }
      break;
    // ---- host side ----
    case 'hello': if(NET.role==='host'){ assignPlayer(peerId,d.name); } break;
    case 'ready': if(NET.role==='host'){ const pl=LOBBY.players.get(peerId); if(pl){pl.ready=d.val; broadcastLobby(); refreshStartBtn();} } break;
    case 'color': if(NET.role==='host'){ hostSetColor(peerId, d.val); } break;
    case 'input': if(NET.role==='host'){ const c=GAME.cars.get(peerId); if(c) c.input=d; } break;
    // ---- client side ----
    case 'lobby': if(NET.role==='client'){ applyLobby(d); } break;
    case 'start': if(NET.role==='client'){ beginRace(d); } break;
    case 'snap':  if(NET.role==='client'){ ingestSnap(d); } break;
    case 'done':  if(NET.role==='client'){ raceFinished(d.results); } break;
  }
}
// heartbeat / drop detection
function startHeartbeat(ch, peerId){
  const iv=setInterval(()=>{
    if(ch.readyState!=='open'){ clearInterval(iv); return; }
    send(ch,{t:'ping',ts:Date.now()});
    const p=NET.peers.get(peerId);
    if(p && Date.now()-p.lastSeen>CFG.DROP_MS){ clearInterval(iv); onChannelClose(peerId); }
    updatePingHud();
  }, CFG.PING_MS);
}

/* ===========================================================================
   [STATE]  — lobby + game model
   =========================================================================== */
const ME = { name:'Driver', pass:'' };
const LOBBY = { players:new Map(), trackIdx:0, bots:[] };   // host-authoritative; bots = selected bot ids
const GAME = {
  hostId:null, track:null, segs:[], laps:3,
  cars:new Map(),          // id -> car (host: authoritative; client: own predicted only)
  idInfo:new Map(),        // id -> {color,name} for EVERY racer incl. bots (client render/leaderboard)
  endDeadline:0,           // host: race auto-ends at this time once humans are done
  phase:'lobby',           // 'lobby'|'countdown'|'race'|'done'
  startAt:0, raceT0:0, tick:0,
  // client interpolation buffer:
  snaps:[],                // [{tc, cars:Map(id->{x,y,a,vx,vy,lap,place,fin})}]
};
function makeCar(id, slot, color, name, kind='balanced'){
  const sp = GAME.track.spawns[slot] || GAME.track.spawns[0];
  const v = VEHICLES[kind];
  return { id, name, color, kind, ...v,
    x:sp.x, y:sp.y, angle:sp.angle, vx:0, vy:0, px:sp.x, py:sp.y,
    input:{s:0,th:0,b:0,d:0,seq:0},
    lap:1, nextCp:1, place:0, finished:false, finishT:0, boost:0,
    // client-only render smoothing fields:
    rx:sp.x, ry:sp.y, ra:sp.angle };
}
function assignPlayer(peerId, name){
  if(LOBBY.players.has(peerId)) { LOBBY.players.get(peerId).name=name; }
  else{
    const used=new Set([...LOBBY.players.values()].map(p=>p.slot));
    let slot=0; while(used.has(slot)) slot++;
    const usedC=new Set([...LOBBY.players.values()].map(p=>p.color));
    const color=CAR_COLORS.find(c=>!usedC.has(c)) || CAR_COLORS[slot%CAR_COLORS.length];
    LOBBY.players.set(peerId,{ id:peerId, name, ready:false, color, slot });
  }
  broadcastLobby(); refreshStartBtn();
}
function broadcastLobby(){
  const d={ t:'lobby', host:NET.myId, trackIdx:LOBBY.trackIdx,
    players:[...LOBBY.players.values()], bots:LOBBY.bots.slice() };
  hostBroadcast(d); applyLobby(d);   // host renders its own lobby too
}
// ---- car colour selection (host-authoritative; colours stay unique) ----
function hostSetColor(id, color){
  if(!CAR_COLORS.includes(color)) return;
  for(const p of LOBBY.players.values()) if(p.id!==id && p.color===color) return; // taken
  const pl=LOBBY.players.get(id); if(pl && pl.color!==color){ pl.color=color; broadcastLobby(); }
}
function pickColor(color){
  if(NET.role==='host') hostSetColor(NET.myId, color);
  else send(NET.hostCh,{t:'color', val:color});      // host validates + echoes via lobby snapshot
}
function applyLobby(d){
  LOBBY.players.clear();
  for(const p of d.players) LOBBY.players.set(p.id,p);
  LOBBY.trackIdx=d.trackIdx;
  LOBBY.bots = Array.isArray(d.bots) ? d.bots : [];
  renderLobby();
}
// ---- bot selection (host/solo only) ----
function toggleBot(id){
  if(NET.role!=='host') return;
  const i=LOBBY.bots.indexOf(id);
  if(i>=0) LOBBY.bots.splice(i,1);
  else if(LOBBY.bots.length<CFG.MAX_BOTS) LOBBY.bots.push(id);
  broadcastLobby();
}

/* ===========================================================================
   [PHYSICS]  — HOST ONLY. Integration + car/car + car/wall collision.
   =========================================================================== */
function integrate(car, dt){
  car.px=car.x; car.py=car.y;                 // remember last position (finish-line crossing test)
  const i=car.input;
  // decompose velocity into forward / lateral relative to current heading
  const fwd={x:Math.cos(car.angle), y:Math.sin(car.angle)};
  const side={x:-fwd.y, y:fwd.x};
  let f = car.vx*fwd.x + car.vy*fwd.y;        // forward speed (signed)
  let s = car.vx*side.x + car.vy*side.y;      // lateral speed
  // longitudinal: engine accel sized so terminal == max; linear drag gives the
  // ~2s ramp AND natural coast-down. engineA = max/driveTau, so f -> max.
  if(car.boost>0) car.boost-=dt;
  const engineA = car.max/car.driveTau;
  f += i.th*engineA*dt;
  f -= i.b*car.brakeA*dt;
  f -= (f/car.driveTau)*dt;                    // drag toward 0 (terminal with throttle = max)
  const cap = car.max*(car.boost>0?1.35:1);    // boost pads briefly lift the ceiling
  if(f>cap) f=cap;
  if(f<-car.max*0.45) f=-car.max*0.45;         // reverse is slower
  // steering scales with speed so a parked car doesn't pivot in place
  car.angle += i.s * car.turn * dt * Math.min(1, Math.abs(f)/120 + 0.12);
  // lateral grip bleeds side-slip; drifting (space/shift) keeps more of it
  s *= (i.d ? car.driftGrip : car.sideGrip);
  // recombine along the (possibly rotated) heading for crisp arcade turning
  const nf={x:Math.cos(car.angle), y:Math.sin(car.angle)}, ns={x:-nf.y, y:nf.x};
  car.vx = nf.x*f + ns.x*s;
  car.vy = nf.y*f + ns.y*s;
  car.x += car.vx*dt; car.y += car.vy*dt;
}
function boostPads(car){
  for(const b of GAME.track.boostPads||[]){
    if((car.x-b.x)**2+(car.y-b.y)**2 < (b.r+car.radius)**2){
      car.boost=0.9;                            // hold the raised speed cap briefly
      const fwd={x:Math.cos(car.angle), y:Math.sin(car.angle)};
      const f=car.vx*fwd.x+car.vy*fwd.y, target=car.max*1.3;
      if(f<target){ const add=target-f; car.vx+=fwd.x*add; car.vy+=fwd.y*add; } // instant kick
    }
  }
}
function carWall(car){
  for(const s of GAME.segs){
    // closest point on segment to car centre
    const dx=s.bx-s.ax, dy=s.by-s.ay, L2=dx*dx+dy*dy||1e-6;
    let t=((car.x-s.ax)*dx+(car.y-s.ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const cx=s.ax+t*dx, cy=s.ay+t*dy;
    const ox=car.x-cx, oy=car.y-cy, d=Math.hypot(ox,oy)||1e-6;
    if(d<car.radius){
      const nx=ox/d, ny=oy/d, pen=car.radius-d;
      car.x+=nx*pen; car.y+=ny*pen;                 // push out
      const vn=car.vx*nx+car.vy*ny;                 // reflect + damp normal velocity
      if(vn<0){ car.vx-=1.5*vn*nx; car.vy-=1.5*vn*ny; car.vx*=0.85; car.vy*=0.85; }
    }
  }
}
function carCar(){   // O(n^2) elastic, fine for <=6
  const arr=[...GAME.cars.values()];
  for(let a=0;a<arr.length;a++) for(let b=a+1;b<arr.length;b++){
    const c1=arr[a], c2=arr[b];
    const dx=c2.x-c1.x, dy=c2.y-c1.y, dist=Math.hypot(dx,dy)||1e-6;
    const min=c1.radius+c2.radius;
    if(dist<min){
      const nx=dx/dist, ny=dy/dist;
      const rel=(c1.vx-c2.vx)*nx+(c1.vy-c2.vy)*ny;
      if(rel>0){                                    // approaching
        const e=0.85, j=-(1+e)*rel/(1/c1.mass+1/c2.mass);
        c1.vx+=j/c1.mass*nx; c1.vy+=j/c1.mass*ny;
        c2.vx-=j/c2.mass*nx; c2.vy-=j/c2.mass*ny;
      }
      const overlap=(min-dist)/2;                   // un-stick
      c1.x-=nx*overlap; c1.y-=ny*overlap;
      c2.x+=nx*overlap; c2.y+=ny*overlap;
    }
  }
}
// do segments p0->p1 and q0->q1 intersect? (used for finish-line crossing)
function segHit(p0,p1,q0,q1){
  const d=(p1.x-p0.x)*(q1.y-q0.y)-(p1.y-p0.y)*(q1.x-q0.x);
  if(Math.abs(d)<1e-9) return false;
  const t=((q0.x-p0.x)*(q1.y-q0.y)-(q0.y-p0.y)*(q1.x-q0.x))/d;
  const u=((q0.x-p0.x)*(p1.y-p0.y)-(q0.y-p0.y)*(p1.x-p0.x))/d;
  return t>=0&&t<=1&&u>=0&&u<=1;
}
// Lap model: checkpoints[1..n-1] are ordered gates the car must collect; checkpoints[0]
// is the start/finish LINE (track.startLine). A lap only counts when the car has
// collected every gate this lap AND then crosses the finish line moving forward
// (positive dot with track.finishDir). This fixes both the early ("1/3 before the line")
// trigger and the drive-backwards-to-finish exploit.
function progress(car){
  const tr=GAME.track, cps=tr.checkpoints, n=cps.length;
  if(car.nextCp < n){                                  // still collecting ordered gates
    const cp=cps[car.nextCp];
    if((car.x-cp.x)**2+(car.y-cp.y)**2 < cp.r*cp.r) car.nextCp++;
    return;
  }
  // armed (nextCp===n): watch for a forward crossing of the finish line
  const sl=tr.startLine, p0={x:car.px,y:car.py}, p1={x:car.x,y:car.y};
  if(segHit(p0,p1,{x:sl.x1,y:sl.y1},{x:sl.x2,y:sl.y2})){
    const dot=(car.x-car.px)*tr.finishDir.x+(car.y-car.py)*tr.finishDir.y;
    if(dot>0){                                         // crossed in the racing direction
      car.nextCp=1; car.lap++;
      if(car.lap>GAME.laps && !car.finished){ car.finished=true; car.finishT=now()-GAME.raceT0; }
    }
  }
}
function rankCars(){
  const tr=GAME.track, cps=tr.checkpoints, n=cps.length, sl=tr.startLine;
  const fin={x:(sl.x1+sl.x2)/2, y:(sl.y1+sl.y2)/2};     // ranking target when armed
  const arr=[...GAME.cars.values()];
  arr.sort((a,b)=>{
    if(a.finished!==b.finished) return a.finished? -1 : 1;       // finishers ahead of non-finishers
    if(a.finished&&b.finished)  return a.finishT-b.finishT;      // both done: by time
    if(b.lap!==a.lap) return b.lap-a.lap;                         // both racing: by progress
    if(b.nextCp!==a.nextCp) return b.nextCp-a.nextCp;
    const ta=a.nextCp<n?cps[a.nextCp]:fin, tb=b.nextCp<n?cps[b.nextCp]:fin;
    const da=(a.x-ta.x)**2+(a.y-ta.y)**2, db=(b.x-tb.x)**2+(b.y-tb.y)**2;
    return da-db;
  });
  arr.forEach((c,i)=>c.place=i+1);
}
// where should this car be heading? (next ordered gate, or the finish line once armed)
function carTarget(car){
  const tr=GAME.track, cps=tr.checkpoints, n=cps.length, sl=tr.startLine;
  return car.nextCp<n ? cps[car.nextCp] : {x:(sl.x1+sl.x2)*0.5, y:(sl.y1+sl.y2)*0.5};
}
/* ---------------------------------------------------------------------------
   [BOTS]  — host-only. Each tick a bot's input is steered toward its next gate,
   plus a smoothed random-walk "wander" and occasional derps, so it weaves around
   imperfectly. Higher skill -> straighter line; higher chaos -> more shenanigans.
   --------------------------------------------------------------------------- */
function initBotState(car){
  car.bot=true;
  car.skill = 0.40 + Math.random()*0.45;   // 0.40 .. 0.85  (cornering competence)
  car.chaos = 0.45 + Math.random()*0.95;   // 0.45 .. 1.40  (how much it misbehaves)
  car.wander=0; car.wanderV=0; car.aiT=0; car.derpS=0; car.derpB=0;
}
function botThink(car, t){
  const tgt=carTarget(car);
  // re-roll brief "derp" intents a few times a second (held between rolls -> not jittery)
  if(t - car.aiT > 0.25){
    car.aiT=t;
    car.derpS = (Math.random() < car.chaos*0.10) ? (Math.random()<0.5?-1:1) : 0;  // wrong-way flick
    car.derpB = (Math.random() < car.chaos*0.08) ? 1 : 0;                          // random brake
  }
  // wander: a slow random walk on the desired heading (sloppier bots wander more)
  car.wanderV = car.wanderV*0.92 + (Math.random()-0.5)*0.11*car.chaos;
  car.wander  = Math.max(-1, Math.min(1, car.wander + car.wanderV));
  const desired = Math.atan2(tgt.y-car.y, tgt.x-car.x) + car.wander*(1.1-car.skill);
  const diff = Math.atan2(Math.sin(desired-car.angle), Math.cos(desired-car.angle));
  const speed = Math.hypot(car.vx, car.vy);
  let s = Math.max(-1, Math.min(1, diff*1.8*car.skill + car.derpS*0.8));
  let th = car.derpB ? 0 : (Math.abs(diff) > 1.1 ? 0.55 : 1);   // ease off into hard turns
  let b  = car.derpB;
  let d  = (Math.abs(s) > 0.65 && speed > 240) ? 1 : 0;          // drift when whipping it around
  car.input = { s, th, b, d };
}

/* ===========================================================================
   [LOOP]  — host fixed-step sim + snapshot; client predict + interpolate.
   =========================================================================== */
let acc=0, last=0, snapAcc=0, inputAcc=0, raf=null;
function now(){ return performance.now()/1000; }

function startRaceLoop(){ last=now(); acc=0; snapAcc=0; inputAcc=0; raf=requestAnimationFrame(frame); }
function stopRaceLoop(){ if(raf) cancelAnimationFrame(raf); raf=null; }

function frame(){
  raf=requestAnimationFrame(frame);
  const t=now(), dt=Math.min(0.05, t-last); last=t;

  if(NET.role==='host'){
    if(GAME.phase==='countdown' && t>=GAME.startAt){ GAME.phase='race'; GAME.raceT0=t; hideCountdown(); }
    if(GAME.phase==='race'){
      const meCar=GAME.cars.get(NET.myId); if(meCar && !meCar.finished) meCar.input=readInput();
      for(const c of GAME.cars.values()){ if(c.bot && !c.finished) botThink(c, t); }
      acc+=dt;
      while(acc>=PHYS_DT){
        for(const c of GAME.cars.values()){ if(c.finished){ c.input={s:0,th:0,b:0,d:0}; }
          integrate(c, PHYS_DT); carWall(c); boostPads(c); progress(c); }
        carCar();
        acc-=PHYS_DT; GAME.tick++;
      }
      rankCars();
      // end when every human is done; give bots a short grace window to scramble in
      const cars=[...GAME.cars.values()];
      if(!GAME.endDeadline){
        const humans=cars.filter(c=>!c.bot);
        if(humans.length && humans.every(c=>c.finished)) GAME.endDeadline = t + CFG.BOT_GRACE;
      }
      if(GAME.endDeadline && (t>=GAME.endDeadline || cars.every(c=>c.finished))) hostEndRace();
    }
    // broadcast snapshots at NET_HZ
    snapAcc+=dt;
    if(snapAcc>=1/CFG.NET_HZ){ snapAcc=0; hostSendSnap(); }
    drawWorld(GAME.cars, /*authoritative*/true);
  }
  else if(NET.role==='client'){
    // send input at INPUT_HZ
    inputAcc+=dt;
    if(inputAcc>=1/CFG.INPUT_HZ){ inputAcc=0; sendInput(); }
    // predict own car locally for responsiveness
    const me=GAME.cars.get(NET.myId);
    if(me && GAME.phase==='race'){ me.input=readInput(); integrate(me, dt); carWall(me); boostPads(me); }
    const render=buildClientView(t);
    drawWorld(render, false);
  }
  updateHud();
}

// ---- host snapshot ----
function hostSendSnap(){
  const cars=[...GAME.cars.values()].map(c=>({
    i:c.id, x:r2(c.x), y:r2(c.y), a:r3(c.angle), vx:r2(c.vx), vy:r2(c.vy),
    l:c.lap, n:c.nextCp, p:c.place, f:c.finished?1:0 }));
  hostBroadcast({ t:'snap', tick:GAME.tick, t0:GAME.raceT0, server:now(), cars,
    phase:GAME.phase, startAt:GAME.startAt });
}
function r2(n){ return Math.round(n*100)/100; } function r3(n){ return Math.round(n*1000)/1000; }

// ---- client ingest + interpolation ----
function ingestSnap(d){
  if(GAME.phase==='lobby') return;
  const m=new Map();
  for(const c of d.cars) m.set(c.i, c);
  GAME.snaps.push({ tc:now(), cars:m });
  if(GAME.snaps.length>16) GAME.snaps.shift();
  // reconcile own predicted car toward authority
  const auth=m.get(NET.myId), me=GAME.cars.get(NET.myId);
  if(auth&&me){
    me.x+=(auth.x-me.x)*0.25; me.y+=(auth.y-me.y)*0.25;     // ease, don't snap
    me.angle=auth.a; me.vx=auth.vx; me.vy=auth.vy;
    me.lap=auth.l; me.nextCp=auth.n; me.place=auth.p; me.finished=!!auth.f;
  }
  if(d.phase==='done') return;
}
function buildClientView(t){
  const out=new Map();
  const me=GAME.cars.get(NET.myId);
  if(me) out.set(NET.myId, me);                  // own predicted car drawn directly
  // interpolate remote cars INTERP_MS in the past
  const rt=t-CFG.INTERP_MS/1000;
  let a=null,b=null;
  for(let i=GAME.snaps.length-1;i>=0;i--){ if(GAME.snaps[i].tc<=rt){ a=GAME.snaps[i]; b=GAME.snaps[i+1]||a; break; } }
  if(!a){ a=GAME.snaps[0]; b=GAME.snaps[0]; }
  if(a){
    const span=(b.tc-a.tc)||1e-3, f=Math.max(0,Math.min(1,(rt-a.tc)/span));
    for(const [id,ca] of a.cars){
      if(id===NET.myId) continue;
      const cb=b.cars.get(id)||ca;
      const inf=GAME.idInfo.get(id)||{};
      out.set(id,{ id, color:inf.color||'#999', name:inf.name||'', radius:VEHICLES.balanced.radius,
        x:ca.x+(cb.x-ca.x)*f, y:ca.y+(cb.y-ca.y)*f, angle:lerpAng(ca.a,cb.a,f),
        lap:ca.l, place:ca.p, finished:!!ca.f });
    }
  }
  return out;
}
function lerpAng(a,b,f){ let d=((b-a+Math.PI)%(2*Math.PI))-Math.PI; return a+d*f; }

function sendInput(){ if(GAME.phase!=='race') return; const i=readInput(); i.t='input'; i.seq=(GAME.tick++); send(NET.hostCh,i); }

/* ===========================================================================
   [INPUT]  — keyboard -> input frame {s,th,b,d}
   =========================================================================== */
const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup',  e=>{ keys[e.key.toLowerCase()]=false; });
function readInput(){
  const up=keys['w']||keys['arrowup'], dn=keys['s']||keys['arrowdown'];
  const lf=keys['a']||keys['arrowleft'], rt=keys['d']||keys['arrowright'];
  return { s:(rt?1:0)-(lf?1:0), th:up?1:0, b:dn?1:0, d:(keys[' ']||keys['shift'])?1:0 };
}

/* ===========================================================================
   [RENDER]  — everything visual. Safe to rewrite without touching netcode.
   World is fit-to-canvas (no camera). Swap drawWorld internals freely.
   =========================================================================== */
const cv=document.getElementById('cv'); const ctx=cv.getContext('2d');
let VIEW={scale:1,ox:0,oy:0};
function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio; cv.height=r.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  if(GAME.track) computeView(r.width,r.height);
}
addEventListener('resize',resize);
function computeView(W,H){
  const w=GAME.track.world.w, h=GAME.track.world.h, pad=24;
  const s=Math.min((W-pad*2)/w,(H-pad*2)/h);
  VIEW={ scale:s, ox:(W-w*s)/2, oy:(H-h*s)/2 };
}
const wx=x=>VIEW.ox+x*VIEW.scale, wy=y=>VIEW.oy+y*VIEW.scale, ws=v=>v*VIEW.scale;

function drawWorld(cars, authoritative){
  const tr=GAME.track; if(!tr) return;
  const W=cv.width/devicePixelRatio, H=cv.height/devicePixelRatio;
  ctx.fillStyle=tr.bg; ctx.fillRect(0,0,W,H);
  // tarmac fill between outer & inner via even-odd
  ctx.beginPath(); poly(tr.outer); poly(tr.inner);
  ctx.fillStyle=tr.tar; ctx.fill('evenodd');
  // boost pads
  for(const b of tr.boostPads||[]){ ctx.beginPath(); ctx.arc(wx(b.x),wy(b.y),ws(b.r),0,7);
    ctx.fillStyle='rgba(39,224,216,.18)'; ctx.fill();
    ctx.strokeStyle='rgba(39,224,216,.6)'; ctx.lineWidth=2; ctx.stroke(); }
  // walls
  ctx.strokeStyle='#3a414c'; ctx.lineWidth=Math.max(2,ws(6)); ctx.lineJoin='round';
  strokePoly(tr.outer); strokePoly(tr.inner);
  // start/finish gate — spans the lane radially (across the driving direction)
  const sl=tr.startLine;
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.setLineDash([ws(16),ws(12)]); ctx.lineWidth=ws(10);
  ctx.beginPath(); ctx.moveTo(wx(sl.x1),wy(sl.y1)); ctx.lineTo(wx(sl.x2),wy(sl.y2)); ctx.stroke();
  ctx.setLineDash([]);
  // cars (sorted so leader draws on top)
  const arr=[...cars.values()].sort((a,b)=>(b.place||0)-(a.place||0));
  for(const c of arr) drawCar(c);
}
function poly(p){ ctx.moveTo(wx(p[0][0]),wy(p[0][1])); for(let i=1;i<p.length;i++) ctx.lineTo(wx(p[i][0]),wy(p[i][1])); ctx.closePath(); }
function strokePoly(p){ ctx.beginPath(); poly(p); ctx.stroke(); }
function drawCar(c){
  const x=wx(c.x), y=wy(c.y), r=ws(c.radius||20), a=c.angle||0;
  ctx.save(); ctx.translate(x,y); ctx.rotate(a);
  // body
  ctx.fillStyle=c.color||'#ccc'; ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2;
  roundRect(-r,-r*0.62,r*2,r*1.24,r*0.4); ctx.fill(); ctx.stroke();
  // nose marker
  ctx.beginPath(); ctx.moveTo(r*0.9,0); ctx.lineTo(r*0.2,-r*0.5); ctx.lineTo(r*0.2,r*0.5);
  ctx.closePath(); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();
  ctx.restore();
  // name + finished flag
  if(c.name){ ctx.fillStyle='rgba(233,237,242,.85)'; ctx.font='11px '+getComputedStyle(document.body).fontFamily;
    ctx.textAlign='center'; ctx.fillText(c.name+(c.finished?' ✓':''), x, y-r-6); }
}
function roundRect(x,y,w,h,rr){ ctx.beginPath();
  ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath(); }

function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- race start / finish orchestration ---- */
function hostStartRace(){
  GAME.track=TRACKS[LOBBY.trackIdx]; GAME.segs=wallsOf(GAME.track); GAME.laps=GAME.track.laps;
  GAME.cars.clear(); GAME.idInfo.clear(); GAME.endDeadline=0;
  // assemble the grid: humans first, then selected bots, each with a fresh slot
  const grid=[]; let slot=0;
  for(const p of LOBBY.players.values())
    grid.push({ id:p.id, slot:slot++, color:p.color, name:p.name, bot:false });
  for(const bid of LOBBY.bots){ const def=BOT_BY_ID[bid]; if(!def) continue;
    grid.push({ id:bid, slot:slot++, color:def.color, name:def.name, bot:true, kind:def.kind }); }
  for(const g of grid){
    const car=makeCar(g.id, g.slot, g.color, g.name, g.kind||'balanced');
    if(g.bot) initBotState(car);
    GAME.cars.set(g.id, car);
    GAME.idInfo.set(g.id, { color:g.color, name:g.name });
  }
  GAME.phase='countdown'; GAME.startAt=now()+CFG.COUNTDOWN; GAME.tick=0;
  hostBroadcast({ t:'start', trackIdx:LOBBY.trackIdx, countdown:CFG.COUNTDOWN, grid });
  enterRace(); runCountdown(GAME.startAt);
}
function beginRace(d){    // client
  GAME.track=TRACKS[d.trackIdx]; GAME.segs=wallsOf(GAME.track); GAME.laps=GAME.track.laps;
  GAME.cars.clear(); GAME.idInfo.clear();
  for(const g of d.grid){
    GAME.idInfo.set(g.id, { color:g.color, name:g.name });    // identities for render + leaderboard
    if(g.id===NET.myId) GAME.cars.set(g.id, makeCar(g.id,g.slot,g.color,g.name)); // client sims only its own
  }
  GAME.phase='countdown'; GAME.startAt=now()+(d.countdown||CFG.COUNTDOWN); GAME.snaps=[];
  enterRace(); runCountdown(GAME.startAt);
}
function enterRace(){ showScreen('race'); resize(); GAME.phase=GAME.phase||'countdown';
  if(!raf) startRaceLoop(); }
function runCountdown(at){
  const el=$('countdown'); el.style.display='flex';
  const tick=()=>{ const left=at-now();
    if(left<=0){ el.textContent='GO'; setTimeout(()=>el.style.display='none',600);
      if(NET.role==='client') GAME.phase='race'; return; }
    el.textContent=Math.ceil(left); requestAnimationFrame(tick); };
  tick();
}
function hideCountdown(){ /* host transitions handled in loop */ const el=$('countdown');
  el.textContent='GO'; setTimeout(()=>el.style.display='none',600); }
function hostEndRace(){
  if(GAME.phase==='done') return; GAME.phase='done';
  rankCars(); const results=[...GAME.cars.values()].sort((a,b)=>a.place-b.place)
    .map(c=>({name:c.name,place:c.place,t:c.finishT})); 
  hostBroadcast({t:'done',results}); raceFinished(results);
}
function raceFinished(results){
  GAME.phase='done';
  const b=$('banner'); b.style.display='block';
  const win=results[0]; b.innerHTML=`<span class="pill">${escapeHtml(win?win.name:'—')} wins</span>`;
  setTimeout(()=>{ b.style.display='none'; showScreen('lobby'); ready=false;
    $('btn-ready').textContent='Ready up'; $('btn-ready').classList.remove('primary');
    if(NET.role==='host'){ for(const p of LOBBY.players.values()) p.ready=(p.id===NET.myId); broadcastLobby(); }
  }, 4200);
}

/* ---- HUD ---- */
function updateHud(){
  if(GAME.phase==='lobby') return;
  const me=GAME.cars.get(NET.myId);
  $('hud-lap').textContent=me?Math.min(me.lap,GAME.laps):1;
  $('hud-laps').textContent=GAME.laps;
  $('hud-pos').textContent=me?ordinal(me.place||'—'):'—';
  if(GAME.phase==='race'){ const t=now()-(GAME.raceT0||GAME.startAt); $('hud-time').textContent=Math.max(0,t).toFixed(1)+'s'; }
  // leaderboard
  const board=$('hud-board');
  let order;
  if(NET.role==='host'){ order=[...GAME.cars.values()].sort((a,b)=>a.place-b.place).map(c=>({name:c.name,id:c.id,place:c.place,lap:c.lap,fin:c.finished})); }
  else { const s=GAME.snaps[GAME.snaps.length-1];
    order = s ? [...s.cars.values()].sort((a,b)=>a.p-b.p).map(c=>({name:(GAME.idInfo.get(c.i)||{}).name||'',id:c.i,place:c.p,lap:c.l,fin:!!c.f})) : []; }
  board.innerHTML=order.map(o=>`<div class="${o.id===NET.myId?'me':''}">${o.place}. ${escapeHtml(o.name||'')} <span style="color:var(--ink-dim)">L${o.lap}${o.fin?' ✓':''}</span></div>`).join('');
}
function updatePingHud(){
  let ping=0;
  if(NET.role==='client'){ const h=NET.peers.get(NET.hostId); ping=h?h.ping:0; }
  else { const arr=[...NET.peers.values()]; ping=arr.length?Math.round(arr.reduce((s,p)=>s+p.ping,0)/arr.length):0; }
  $('hud-ping').textContent=ping||'—';
  setNetDot(ping<80?'ok':ping<200?'warn':'bad');
}
function ordinal(n){ if(typeof n!=='number') return n; const s=['th','st','nd','rd'],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]); }

/* ===========================================================================
   [INIT]
   =========================================================================== */
function fullReset(){
  NET.cancelled=true;
  if(SIG.poller) clearInterval(SIG.poller); SIG.poller=null;
  if(SIG._hostCloseTimer) clearTimeout(SIG._hostCloseTimer); SIG._hostCloseTimer=null;
  stopRaceLoop();
  for(const p of NET.peers.values()){ try{p.pc.close();}catch{} }
