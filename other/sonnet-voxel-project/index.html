<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game"></div>
  <div id="hud"></div>

  <!--
    No bundler, no npm install, no build step: GitHub Pages serves this
    over real https://, so native ES module imports (in main.js and every
    src/*.js file) just work. Three.js is vendored locally in /vendor
    rather than pulled from a CDN, so the whole game keeps working even if
    a CDN is unreachable or blocked - "download this repo" is the only
    dependency.
  -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
